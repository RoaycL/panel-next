# ======================
# Basic configuration
# ======================
[base]
# Web run port. Default:3002
http_port=3002
# Database driver [postgres(Default)/sqlite/mysql]
database_drive=postgres
# Cache driver [redis/memory(Default)]
cache_drive=memory
# Queue driver [redis/memory(Default)]
queue_drive=memory
# File cache path (Please start with the current path './')
# Warning: The files that have been uploaded after the modification cannot be accessed
source_path=./uploads
# File cache path.
source_temp_path=./runtime/temp

# ======================
# Mysql database driver
# ======================
[mysql]
host=127.0.0.1
port=3306
username=root
password=root
db_name=sun_panel
wait_timeout=100

# ======================
# PostgreSQL database driver
# ======================
[postgres]
host=127.0.0.1
port=5432
username=panel_next
password=change-me
db_name=panel_next
ssl_mode=disable
connect_timeout=10
conn_max_lifetime=300

# ======================
# Cross-origin access
# ======================
[cors]
# Comma-separated exact HTTP(S) origins. Empty means no cross-origin Web access.
web_origins=
# Comma-separated 32-character Chrome extension IDs. Wildcards are not accepted.
extension_ids=

# ======================
# Authentication migration
# ======================
[session]
# RFC3339 deadline for accepting and issuing legacy tokens. It may be shortened,
# but cannot extend the compiled final deadline of 2026-11-07T00:00:00Z.
legacy_token_until=2026-11-07T00:00:00Z

# ======================
# sqlite database driver
# ======================
[sqlite]
file_path=./database/database.db

# ======================
# redis database driver
# ======================
[redis]
address=127.0.0.1:6379
password=
prefix=sun_panel:
db=0
