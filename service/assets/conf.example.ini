# ======================
# Basic configuration
# ======================
[base]
# Web run port. Default:3002
http_port=3002
# Database driver [postgres(Default)/sqlite/mysql]
database_drive=postgres
# Cache driver [redis/memory(Default)]
cache_drive=memory
# Queue driver [redis/memory(Default)]
queue_drive=memory
# File storage path (relative to current dir). For Docker, mount conf/files as volume.
source_path=./uploads
# Temporary file cache path.
source_temp_path=./runtime/temp
# Web static root directory. Default: ./web
web_path=./web

# Docker deployment recommendation:
#   - Mount the entire conf/ directory as a volume: docker run -v $(pwd)/conf:/app/conf ...
#   - Inside conf/, create: files/, custom/, database.db, conf.ini
#   - Adjust source_path, web_path, sqlite.file_path relative to /app/conf inside container

# ======================
# Mysql database driver
# ======================
[mysql]
host=127.0.0.1
port=3306
username=root
password=root
db_name=sun_panel
wait_timeout=100

# ======================
# PostgreSQL database driver
# ======================
[postgres]
host=127.0.0.1
port=5432
username=panel_next
password=change-me
db_name=panel_next
ssl_mode=disable
connect_timeout=10
conn_max_lifetime=300

# ======================
# Cross-origin access
# ======================
[cors]
# Comma-separated exact HTTP(S) origins. Empty means no cross-origin Web access.
web_origins=
# Comma-separated 32-character Chrome extension IDs. Wildcards are not accepted.
extension_ids=

# ======================
# Authentication migration
# ======================
[session]
# RFC3339 deadline for accepting and issuing legacy tokens. It may be shortened,
# but cannot extend the compiled final deadline of 2026-11-07T00:00:00Z.
legacy_token_until=2026-11-07T00:00:00Z

# ======================
# sqlite database driver
# ======================
[sqlite]
file_path=./database/database.db

# ======================
# redis database driver
# ======================
[redis]
address=127.0.0.1:6379
password=
prefix=sun_panel:
db=0
