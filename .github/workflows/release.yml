name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VERSION=$(cut -d '|' -f 2 ./service/assets/version)" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm run build

      - name: Build extension
        run: pnpm run build:extension

      - name: Package extension
        run: pnpm run package:extension

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-next-extension-v${{ steps.version.outputs.VERSION }}
          path: artifacts/panel-next-extension-v${{ steps.version.outputs.VERSION }}.zip
          if-no-files-found: error

      - name: Upload SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: panel-next-extension-v${{ steps.version.outputs.VERSION }}.sha256
          path: artifacts/panel-next-extension-v${{ steps.version.outputs.VERSION }}.zip.sha256
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VERSION=$(cut -d '|' -f 2 ./service/assets/version)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKER_IMAGE_NAME || 'panel-next/panel-next' }}:${{ steps.version.outputs.VERSION }}
            ${{ vars.DOCKER_IMAGE_NAME || 'panel-next/panel-next' }}:latest