<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Panel Next</title>
    <style>
      :root { color-scheme: light dark; background: #f7f7f8; color: #262626; }
      body { margin: 0; }
      .loading-wrap { min-height: 100vh; display: grid; place-content: center; gap: 14px; text-align: center; font: 13px system-ui, sans-serif; }
      .loading-mark { margin: auto; width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid #8883; border-radius: 12px; font-weight: 600; }
      :root[data-boot-wallpaper] .loading-wrap { visibility: hidden; }
      @media (prefers-color-scheme: dark) { :root { background: #101012; color: #ddd; } }
    </style>
  </head>
  <body class="dark:bg-black" data-panel-runtime="extension">
    <div id="app">
      <div class="loading-wrap" aria-label="Loading Panel Next">
        <div class="loading-mark">PN</div><span>Panel Next</span>
      </div>
    </div>
    <script type="module" src="../src/main.ts"></script>
  </body>
</html>
